# RT Finance di belakang Cloudflare (Full (strict), Origin Certificate di /etc/nginx/ssl/).
#   gmm-rt001.ruangin.xyz      → 127.0.0.1:6000  (web, Next.js)
#   api-gmm-rt001.ruangin.xyz  → 127.0.0.1:6001  (api, Express)
# Backend: TRUST_PROXY=2 (Cloudflare + nginx) supaya IP asli pengunjung terbaca untuk rate limit.
# Pasang: /etc/nginx/sites-available/rt-finance.conf → symlink ke sites-enabled, lalu nginx -t && reload.

server {
    listen 80;
    listen [::]:80;

    server_name gmm-rt001.ruangin.xyz api-gmm-rt001.ruangin.xyz;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name gmm-rt001.ruangin.xyz;

    ssl_certificate     /etc/nginx/ssl/ruangin.pem;
    ssl_certificate_key /etc/nginx/ssl/ruangin.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:6000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name api-gmm-rt001.ruangin.xyz;

    ssl_certificate     /etc/nginx/ssl/ruangin.pem;
    ssl_certificate_key /etc/nginx/ssl/ruangin.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    # foto bukti transfer maks. 5 MB (default nginx hanya 1 MB)
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:6001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
