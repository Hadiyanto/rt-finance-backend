# RT Finance di belakang Cloudflare (proxy oranye aktif, SSL/TLS mode: Full (strict)).
#
#   gmm-rt001.ruangin.xyz      → 127.0.0.1:6000  (web, Next.js)
#   api-gmm-rt001.ruangin.xyz  → 127.0.0.1:6001  (api, Express)
#
# Pasang di: /etc/nginx/sites-available/rt-finance.conf  lalu symlink ke sites-enabled/
# Sertifikat: Cloudflare Origin Certificate (Dashboard → SSL/TLS → Origin Server → Create Certificate,
#             cakup kedua hostname), simpan sebagai file di bawah ini (chmod 600 untuk key).
# `listen ... ssl http2` dipakai supaya jalan di nginx lama (Ubuntu 22.04: 1.18). Di nginx ≥ 1.25 muncul
# peringatan "deprecated" (tidak masalah); boleh diganti `listen 443 ssl;` + `http2 on;`.
# Uji: sudo nginx -t && sudo systemctl reload nginx
# Backend: TRUST_PROXY=1 (nginx satu-satunya proxy di depan app).

# IP asli pengunjung dari Cloudflare (untuk rate limit login & form publik); kalau header tidak ada,
# pakai IP koneksi. Catatan: header ini bisa dipalsukan kalau ada yang mengakses VPS langsung tanpa
# lewat Cloudflare — batasi port 80/443 hanya untuk IP Cloudflare di firewall kalau perlu.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# HTTP → HTTPS (Cloudflare biasanya sudah redirect; ini untuk jaga-jaga)
server {
    listen 80;
    listen [::]:80;
    server_name gmm-rt001.ruangin.xyz api-gmm-rt001.ruangin.xyz;
    return 301 https://$host$request_uri;
}

# --- Frontend ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gmm-rt001.ruangin.xyz;

    ssl_certificate     /etc/ssl/cloudflare/ruangin.xyz.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ruangin.xyz.key;

    access_log /var/log/nginx/rt-finance-web.access.log;
    error_log  /var/log/nginx/rt-finance-web.error.log;

    location / {
        proxy_pass http://127.0.0.1:6000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# --- Backend API ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-gmm-rt001.ruangin.xyz;

    ssl_certificate     /etc/ssl/cloudflare/ruangin.xyz.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ruangin.xyz.key;

    access_log /var/log/nginx/rt-finance-api.access.log;
    error_log  /var/log/nginx/rt-finance-api.error.log;

    # foto bukti transfer maks. 5 MB (dibatasi juga di API); sedikit lebih longgar untuk overhead multipart
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;      # hanya IP asli, header X-Forwarded-For dari luar diabaikan
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
